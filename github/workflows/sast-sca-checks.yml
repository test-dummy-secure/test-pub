# sast-sca-checks.yml  ->  goes to  .github/workflows/sast-sca-checks.yml
# PHASE 1 PILOT: SAST + SCA on one repository.
#
# Admin controls (no file editing needed after setup):
#   Settings -> Secrets and variables -> Actions -> Variables
#     REPORT_ONLY = true   -> checks run and report, but NEVER block (week 1)
#     REPORT_ONLY = false  -> new HIGH/CRITICAL findings block the PR (week 2+)
#     SEND_TO_DEFECTDOJO = false  -> keep false until DefectDojo exists
 
name: Security Checks (SAST + SCA)
 
on:
  pull_request:                 # every proposed code change
  schedule:
    - cron: "0 2 * * *"         # daily full scan at 02:00 UTC
  workflow_dispatch:            # "Run workflow" button for manual testing
 
permissions:
  contents: read
 
jobs:
  # ------------------------------------------------------------------
  # SAST - checks OUR OWN code for security mistakes
  # ------------------------------------------------------------------
  sast:
    name: SAST (code check)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    continue-on-error: ${{ vars.REPORT_ONLY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Scan changed code (PR) or everything (daily)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: diff-aware - only NEW issues introduced by this change
            semgrep scan \
              --config p/owasp-top-ten \
              --baseline-commit ${{ github.event.pull_request.base.sha }} \
              --severity ERROR \
              --json --output sast-report.json \
              --error
          else
            # Daily: full scan, never blocks anything (informational)
            semgrep scan \
              --config p/owasp-top-ten --config p/security-audit \
              --json --output sast-report.json || true
          fi
 
      - name: Keep the report (downloadable for 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report-${{ github.run_id }}
          path: sast-report.json
 
      - name: Send to DefectDojo (off until it exists)
        if: always() && vars.SEND_TO_DEFECTDOJO == 'true'
        run: |
          curl -sf -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Semgrep JSON Report" -F "file=@sast-report.json" \
            -F "product_name=${{ github.repository }}" \
            -F "engagement_name=SAST" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" || true
 
  # ------------------------------------------------------------------
  # SCA - checks BORROWED packages against known-vulnerability lists
  # ------------------------------------------------------------------
  sca:
    name: SCA (dependency check)
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.REPORT_ONLY == 'true' }}
    steps:
      - uses: actions/checkout@v4
 
      - name: Download OSV-Scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o osv-scanner && chmod +x osv-scanner
 
      - name: Scan dependencies
        run: |
          # -r scans every lockfile it finds (npm, pip, go, maven...)
          ./osv-scanner scan -r . \
            --format json --output sca-report.json || true
 
      - name: Block only on serious problems that HAVE a fix
        run: |
          COUNT=$(jq '[.results[]?.packages[]?.vulnerabilities[]?
            | select((.database_specific.severity=="HIGH") or (.database_specific.severity=="CRITICAL"))
            | select([.affected[]?.ranges[]?.events[]? | has("fixed")] | any)
            ] | length' sca-report.json 2>/dev/null || echo 0)
          echo "Fixable HIGH/CRITICAL dependency problems: $COUNT"
          [ "$COUNT" -eq 0 ] || exit 1
 
      - name: Keep the report (downloadable for 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report-${{ github.run_id }}
          path: sca-report.json
 
      - name: Send to DefectDojo (off until it exists)
        if: always() && vars.SEND_TO_DEFECTDOJO == 'true'
        run: |
          curl -sf -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=OSV Scan" -F "file=@sca-report.json" \
            -F "product_name=${{ github.repository }}" \
            -F "engagement_name=SCA" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" || true
