# .github/workflows/sast-sca-checks.yml
#
# PHASE 1 PILOT: SAST + SCA
#
# GitHub Actions Variables:
#   REPORT_ONLY=true
#       -> Security findings are reported but should not block the PR.
#
#   REPORT_ONLY=false
#       -> Security jobs can block the PR based on the configured checks.
#
#   SEND_TO_DEFECTDOJO=true
#       -> Upload SAST/SCA reports to DefectDojo.
#
# GitHub Actions Secrets:
#   DEFECTDOJO_URL
#       Example:
#       http://203.145.168.114:6323
#
#   DEFECTDOJO_API_KEY
#       DefectDojo API token.
#

name: Security Checks (SAST + SCA)

on:
  pull_request:

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ================================================================
  # SAST
  # ================================================================
  sast:
    name: SAST (code check)
    runs-on: ubuntu-latest

    container: semgrep/semgrep

    continue-on-error: ${{ vars.REPORT_ONLY == 'true' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Scan changed code (PR) or everything (daily)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then

            semgrep scan \
              --config p/owasp-top-ten \
              --baseline-commit ${{ github.event.pull_request.base.sha }} \
              --severity ERROR \
              --json \
              --output sast-report.json \
              --error

          else

            semgrep scan \
              --config p/owasp-top-ten \
              --config p/security-audit \
              --json \
              --output sast-report.json || true

          fi


      - name: Keep SAST report
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: sast-report-${{ github.run_id }}
          path: sast-report.json


      # ============================================================
      # SEND SAST REPORT TO DEFECTDOJO
      # ============================================================
      - name: Send SAST report to DefectDojo
        if: always() && vars.SEND_TO_DEFECTDOJO == 'true'

        shell: bash

        run: |

          echo "Uploading SAST report to DefectDojo..."

          HTTP_STATUS=$(curl \
            -sS \
            -o defectdojo-sast-response.json \
            -w "%{http_code}" \
            -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "file=@sast-report.json" \
            -F "product_name=${{ github.repository }}" \
            -F "engagement_name=SAST" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"
          )

          echo "DefectDojo HTTP status: ${HTTP_STATUS}"

          echo "DefectDojo response:"
          cat defectdojo-sast-response.json

          if [[ "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            echo "SAST report successfully uploaded to DefectDojo."
          else
            echo "ERROR: DefectDojo rejected the SAST report."
            exit 1
          fi


  # ================================================================
  # SCA
  # ================================================================
  sca:
    name: SCA (dependency check)

    runs-on: ubuntu-latest

    continue-on-error: ${{ vars.REPORT_ONLY == 'true' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download OSV-Scanner
        run: |
          curl -sSL \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o osv-scanner

          chmod +x osv-scanner


      - name: Scan dependencies
        run: |
          ./osv-scanner scan -r . \
            --format json \
            --output sca-report.json || true


      - name: Block only on serious fixable vulnerabilities
        run: |

          COUNT=$(jq '
            [
              .results[]?.packages[]?.vulnerabilities[]?
              | select(
                  (.database_specific.severity=="HIGH")
                  or
                  (.database_specific.severity=="CRITICAL")
                )
              | select(
                  [
                    .affected[]?.ranges[]?.events[]?
                    | has("fixed")
                  ] | any
                )
            ] | length
          ' sca-report.json 2>/dev/null || echo 0)

          echo "Fixable HIGH/CRITICAL dependency problems: $COUNT"

          [ "$COUNT" -eq 0 ] || exit 1


      - name: Keep SCA report
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: sca-report-${{ github.run_id }}
          path: sca-report.json


      # ============================================================
      # SEND SCA REPORT TO DEFECTDOJO
      # ============================================================
      - name: Send SCA report to DefectDojo
        if: always() && vars.SEND_TO_DEFECTDOJO == 'true'

        shell: bash

        run: |

          echo "Uploading SCA report to DefectDojo..."

          HTTP_STATUS=$(curl \
            -sS \
            -o defectdojo-sca-response.json \
            -w "%{http_code}" \
            -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=OSV Scan" \
            -F "file=@sca-report.json" \
            -F "product_name=${{ github.repository }}" \
            -F "engagement_name=SCA" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"
          )

          echo "DefectDojo HTTP status: ${HTTP_STATUS}"

          echo "DefectDojo response:"
          cat defectdojo-sca-response.json

          if [[ "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            echo "SCA report successfully uploaded to DefectDojo."
          else
            echo "ERROR: DefectDojo rejected the SCA report."
            exit 1
          fi
